# Kafka topics of slot A1, shared by localhost (compose.yaml) and the broker instance (KAN-2 ADR-122).
# One record per line: <topic> <partitions> <retention-ms>
# Naming: <producer>.events for domain events (KAN-2 section 4.4); retention 7 days (604800000 ms).
# Retry and dead-letter topics: <topic>.<consumer>.retry and <topic>.<consumer>.dlt (ADR-049, ADR-093).
member-management.events                          3  604800000
identity-access.events                            3  604800000
member-management.events.identity-access.retry    1  604800000
member-management.events.identity-access.dlt      1  604800000
