# Kafka ACLs: each service writes only its own topic and reads only the topics that the
# event catalog assigns to it (KAN-2 section 4.4.1). No ACL means no access
# (allow.everyone.if.no.acl.found=false).
# One record per line: <user> <operation> <resource-type> <resource-name> <pattern-type>
#   operation:     Read | Write | Describe | DescribeConfigs | IdempotentWrite
#   resource-type: topic | group | cluster
#   pattern-type:  literal | prefixed
member-management-service  Write            topic    member-management.events                        literal
member-management-service  Describe         topic    member-management.events                        literal
member-management-service  IdempotentWrite  cluster  kafka-cluster                                   literal
member-management-service  Read             topic    identity-access.events                          literal
member-management-service  Read             group    member-management-service                       prefixed
identity-access-service    Write            topic    identity-access.events                          literal
identity-access-service    Describe         topic    identity-access.events                          literal
identity-access-service    IdempotentWrite  cluster  kafka-cluster                                   literal
identity-access-service    Read             topic    member-management.events                        literal
identity-access-service    Read             topic    member-management.events.identity-access.retry  literal
identity-access-service    Write            topic    member-management.events.identity-access.retry  literal
identity-access-service    Write            topic    member-management.events.identity-access.dlt    literal
identity-access-service    Read             group    identity-access-service                         prefixed
