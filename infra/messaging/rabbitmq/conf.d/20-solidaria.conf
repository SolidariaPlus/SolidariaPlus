# Settings shared by localhost and the broker instance of A1 (KAN-2 ADR-122).
# Services authenticate with MS-17 machine-to-machine tokens through the OAuth 2.0 backend;
# the internal backend only keeps the administrator user used for provisioning.
# The JWKS URL (and, in AWS, the TLS listener) are added by a second file in conf.d.
auth_backends.1 = rabbit_auth_backend_oauth2
auth_backends.2 = internal

auth_oauth2.resource_server_id = rabbitmq
auth_oauth2.preferred_username_claims.1 = client_id
auth_oauth2.preferred_username_claims.2 = sub

default_vhost = solidaria
loopback_users = none
log.console = true
log.console.level = info
