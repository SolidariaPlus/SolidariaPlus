# Localhost only. RabbitMQ 4.1+ only accepts an https JWKS URL, and MS-17 serves plain HTTP
# on the workstation (./gradlew :identity-access-service:bootRun, port 8097). Until MS-17 issues
# tokens (KAN-18) and a local TLS endpoint exists, keep the internal backend only, as
# infra/messaging/scripts/broker-start.sh does when no JWKS URL is set. Services and tests use
# the internal administrator user.
auth_backends.1 = internal
