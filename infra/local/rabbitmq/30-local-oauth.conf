# Localhost only: RabbitMQ trusts the signing keys of MS-17 running on the workstation
# (./gradlew :identity-access-service:bootRun, port 8097). Until MS-17 issues tokens
# (KAN-18), services and tests use the internal administrator user.
auth_oauth2.jwks_url = http://host.docker.internal:8097/oauth2/jwks
