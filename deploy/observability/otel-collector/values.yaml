# OpenTelemetry collector: receives OTLP traces from the services (OpenTelemetry Java agent) and
# exports them to AWS X-Ray (KAN-33; KAN-2 section 6.7). Installed only when X-Ray is available in
# the account (OI-02, variable enable_xray of modules/platform-addons).
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
  exporters:
    awsxray:
      region: ${env:AWS_REGION}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [awsxray]

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
