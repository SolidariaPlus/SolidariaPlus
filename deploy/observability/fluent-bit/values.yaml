# Fluent Bit: structured JSON logs of every pod to Amazon CloudWatch Logs (KAN-33; KAN-2 section
# 6.7). AWS_REGION and LOG_GROUP are set by modules/platform-addons; the pods use the LabRole
# credentials of the node (KAN-2 ADR-112).
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Exclude_Path /var/log/containers/fluent-bit*
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name modify
        Match kube.*
        Add environment ${ENVIRONMENT}

  outputs: |
    [OUTPUT]
        Name cloudwatch_logs
        Match kube.*
        region ${AWS_REGION}
        log_group_name ${LOG_GROUP}
        log_stream_template $kubernetes['namespace_name'].$kubernetes['pod_name']
        log_stream_prefix pod-
        auto_create_group false

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 128Mi

tolerations:
  - operator: Exists
