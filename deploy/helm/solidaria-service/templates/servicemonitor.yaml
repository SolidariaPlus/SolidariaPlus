{{- if and .Values.enabled .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "solidaria.name" . }}
  labels:
    {{- include "solidaria.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "solidaria.selectorLabels" . | nindent 6 }}
  targetLabels: [service]
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.interval }}
{{- end }}
