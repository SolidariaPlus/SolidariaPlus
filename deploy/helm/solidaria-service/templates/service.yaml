{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "solidaria.name" . }}
  labels:
    {{- include "solidaria.labels" . | nindent 4 }}
    service: {{ include "solidaria.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "solidaria.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "solidaria.serviceAccountName" . }}
  labels:
    {{- include "solidaria.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
