[versions]
java = "21"
spring-boot = "4.2.0"
spring-dependency-management = "1.1.7"
spring-cloud-aws = "4.2.2"
resilience4j = "2.4.0"
testcontainers = "2.0.5"
archunit = "1.5.1"
junit = "6.1.3"
# Micrometer and Flyway: version managed by the Spring Boot BOM
# Code quality
spotless = "8.12.0"
palantir-java-format = "2.103.0"
ktlint = "1.8.0"
checkstyle = "14.4.0"

[libraries]
# BOMs (imported by the solidaria.spring-boot-service convention plugin)
spring-cloud-aws-bom = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "spring-cloud-aws" }
resilience4j-bom = { module = "io.github.resilience4j:resilience4j-bom", version.ref = "resilience4j" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# Spring Boot
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Spring Cloud AWS (versions from spring-cloud-aws-bom)
spring-cloud-aws-starter = { module = "io.awspring.cloud:spring-cloud-aws-starter" }
spring-cloud-aws-starter-sqs = { module = "io.awspring.cloud:spring-cloud-aws-starter-sqs" }
spring-cloud-aws-starter-sns = { module = "io.awspring.cloud:spring-cloud-aws-starter-sns" }
spring-cloud-aws-starter-s3 = { module = "io.awspring.cloud:spring-cloud-aws-starter-s3" }
spring-cloud-aws-starter-dynamodb = { module = "io.awspring.cloud:spring-cloud-aws-starter-dynamodb" }
spring-cloud-aws-starter-secrets-manager = { module = "io.awspring.cloud:spring-cloud-aws-starter-secrets-manager" }
spring-cloud-aws-starter-parameter-store = { module = "io.awspring.cloud:spring-cloud-aws-starter-parameter-store" }
spring-cloud-aws-testcontainers = { module = "io.awspring.cloud:spring-cloud-aws-testcontainers" }

# Resilience4j (versions from resilience4j-bom)
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4" }
resilience4j-micrometer = { module = "io.github.resilience4j:resilience4j-micrometer" }

# Micrometer and its Spring Boot tracing module (versions from Spring Boot)
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }

# Flyway (Spring Boot starter + database support, versions from Spring Boot)
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Tests
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-localstack = { module = "org.testcontainers:testcontainers-localstack" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Plugins consumidos como dependencias por build-logic (convention plugins)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[bundles]
observability = ["spring-boot-starter-actuator", "micrometer-registry-prometheus", "micrometer-tracing-bridge-otel", "spring-boot-micrometer-tracing-opentelemetry"]
resilience = ["resilience4j-spring-boot4", "resilience4j-micrometer", "spring-boot-starter-aspectj"]
testcontainers = ["spring-boot-testcontainers", "testcontainers-junit-jupiter"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
