name: promote-prod

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or SHA already validated in QA"
        required: true

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote-prod:
    runs-on: ubuntu-latest
    # Environment "production" (with required reviewers) -> Jira "production" (rule AR-03)
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
