version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "ci(deps)" }
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ["/services/*/*"]
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      docker-base-images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: ["/infra/terraform/envs/*", "/infra/terraform/modules/*"]
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      terraform-providers:
        patterns: ["*"]
