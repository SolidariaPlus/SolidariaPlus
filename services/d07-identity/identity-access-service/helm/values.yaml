# Helm values of identity-access-service for the shared chart deploy/helm/solidaria-service (KAN-33).
enabled: true
nameOverride: identity-access-service
containerPort: 8097

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 768Mi

# The service runs under the context path /auth (edge routes /auth/* unchanged to the ALB).
probes:
  startup:
    path: /auth/actuator/health/liveness
  liveness:
    path: /auth/actuator/health/liveness
  readiness:
    path: /auth/actuator/health/readiness

metrics:
  path: /auth/actuator/prometheus

ingress:
  enabled: true
  paths:
    - path: /auth
      pathType: Prefix

networkPolicy:
  enabled: true
  egress:
    # Aurora PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Valkey
    - ports:
        - port: 6379
          protocol: TCP
    # Kafka (SASL_SSL)
    - ports:
        - port: 9092
          protocol: TCP
    # LDAPS (Active Directory)
    - ports:
        - port: 636
          protocol: TCP
    # HTTPS (Secrets Manager, Parameter Store, KMS)
    - ports:
        - port: 443
          protocol: TCP
